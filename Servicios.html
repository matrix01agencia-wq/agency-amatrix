<!DOCTYPE html>

    <style>

        body { background-color: #000; color: #fff; font-family: 'Montserrat', sans-serif; }
        .impact-title { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; line-height: 0.85; }
        .neon-green { color: #39FF14; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .glass-card:hover { border-color: #39FF14; box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
    </style>
</head>
<body>
    <nav class="bg-black/95 border-b border-white/10 p-5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-xl font-bold italic neon-green">AGENCY AMATRIX</span>
            <div class="space-x-6 text-[12px] font-bold uppercase">
                <a href="index.html">Inicio</a>
                <a href="servicios.html" class="neon-green">Servicios</a>
                <a href="profesionales.html">Profesionales</a>
                <a href="agenda.html">Agenda</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </div>
    </nav>

    </header>

    <main class="max-w-7xl mx-auto px-10 pb-20 grid grid-cols-2 md:grid-cols-4 gap-6">
        <div class="glass-card p-6 rounded-xl border-l-4 border-[#39FF14]">

            <a href="agenda.html" class="block text-center bg-[#39FF14] text-black text-[10px] font-bold py-2 rounded uppercase">Reservar</a>
        </div>
        <div class="glass-card p-6 rounded-xl border-l-4 border-[#FF00FF]">
            <h3 class="font-bold text-lg mb-2">MASAJES</h3>
            <p class="text-gray-400 text-[10px] mb-4">Relajación a domicilio.</p>
            <a href="agenda.html" class="block text-center bg-white text-black text-[10px] font-bold py-2 rounded uppercase">Reservar</a>
