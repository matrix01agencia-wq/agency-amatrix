<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Amatrix | Seguimiento en Tiempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;700&display=swap');
        
        body { background-color: #000; color: #fff; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        .impact-title { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; line-height: 0.85; letter-spacing: -2px; }
        .neon-green-text { color: #39FF14; }
        .glass-card { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Simulación de Mapa */
        .map-bg {
            background-image: url('https://user-images.githubusercontent.com/1778943/40833930-6f014494-659f-11e8-971c-7f516a575a0c.png'); /* Mapa oscuro tipo Uber */
            background-size: cover;
            height: 100vh;
            width: 100%;
            position: absolute;
            z-index: -1;
            filter: brightness(0.4) grayscale(0.5);
        }

        .pulse-marker {
            width: 20px;
            height: 20px;
            background: #39FF14;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(57, 255, 20, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(57, 255, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0); }
        }
    </style>
</head>
<body>

    <div class="map-bg"></div>

    <nav class="p-5 flex justify-between items-center bg-black/50 border-b border-white/10">
        <a href="index.html" class="text-[#39FF14] font-bold italic">← VOLVER</a>
        <span class="text-[10px] font-bold uppercase tracking-widest text-white/50">GPS ACTIVO | ENCRIPTACIÓN ESCROW</span>
    </nav>

    <main class="absolute bottom-0 w-full p-6">
        <div class="max-w-md mx-auto glass-card rounded-3xl p-6 border-t-4 border-[#39FF14]">
            
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h1 class="impact-title text-4xl">LLEGANDO EN</h1>
                    <span class="text-5xl font-bold neon-green-text">5 MIN</span>
                </div>
                <div class="pulse-marker mb-2"></div>
            </div>

            <hr class="border-white/10 mb-6">

            <div class="flex items-center gap-4 mb-6">
                <div class="relative">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" class="w-16 h-16 rounded-full border-2 border-[#39FF14]">
                    <div class="absolute bottom-0 right-0 bg-[#39FF14] text-black text-[8px] px-1 font-bold rounded">PRO</div>
                </div>
                <div class="flex-grow">
                    <h3 class="font-bold text-lg">Carlos Rodríguez</h3>
                    <p class="text-[10px] text-gray-400 uppercase">Especialista en Electricidad</p>
                    <div class="flex text-[#39FF14] text-xs">⭐⭐⭐⭐⭐ <span class="text-white ml-2">(142 servicios)</span></div>
                </div>
                <a href="https://wa.me/tu_numero" class="bg-white/10 p-3 rounded-full hover:bg-[#39FF14]/20 transition">
                    <img src="https://img.icons8.com/ios-filled/50/39FF14/whatsapp.png" class="w-6 h-6">
                </a>
            </div>

            <div class="space-y-3 mb-6">
                <div class="flex items-center gap-3 text-sm">
                    <div class="w-2 h-2 bg-[#FF00FF] rounded-full"></div>
                    <p class="text-gray-300">Servicio solicitado: <span class="text-white font-bold uppercase">Reparación de Tablero</span></p>
                </div>
                <div class="flex items-center gap-3 text-sm">
                    <div class="w-2 h-2 bg-white rounded-full"></div>
                    <p class="text-gray-300">Tarifa pactada: <span class="text-[#39FF14] font-bold">$45.00</span></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button class="bg-white/5 border border-white/10 py-3 rounded-xl text-xs font-bold uppercase hover:bg-red-500/20">Cancelar</button>
                <button class="bg-[#39FF14] text-black py-3 rounded-xl text-xs font-bold uppercase hover:shadow-[0_0_20px_#39FF14]">Confirmar Llegada</button>
            </div>
        </div>
    </main>

    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
        <div class="pulse-marker scale-150"></div>
    </div>

</body>
</html>
